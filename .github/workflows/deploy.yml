name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar @google/clasp
        run: npm install -g @google/clasp

      - name: Crear archivo de autenticación de Clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Verificar que .clasprc.json no esté vacío
        run: cat ~/.clasprc.json

      - name: Verificar qué archivos existen localmente
        run: ls -la ./src

      - name: Sincronizar archivos con Apps Script (Push)
        run: clasp push -f

      - name: Desplegar nueva versión
        run: clasp deploy --description "Despliegue automático desde GitHub Actions"